# The computing thread: Gauss -> ChatGPT
#
# One entry per milestone. Fields:
#   id      stable slug
#   date    free-form (year or ISO date); first 4 chars must be the year
#   kind    paper | patent | tech | business
#   title   human label for the event
#   who     actor(s), optional
#   refs    optional: doi / patent_number / title_search (OpenAlex fallback)
#   related optional: ids of other entries this event connects to
#   notes   factual annotations, corrections, context

entries:
  # --- mathematical foundations ---
  - id: gauss-least-squares-1809
    date: "1809"
    kind: paper
    title: "Theoria motus corporum coelestium (introduces least squares)"
    who: Carl Friedrich Gauss
    refs:
      title_search: "Theoria motus corporum coelestium sectionibus conicis solem ambientium"
    notes: "Method of least squares also claimed earlier (1795) by Legendre's 1805 publication priority dispute."

  - id: maxwell-electromagnetic-1865
    date: "1865"
    kind: paper
    title: "A Dynamical Theory of the Electromagnetic Field"
    who: James Clerk Maxwell
    refs:
      doi: 10.1098/rstl.1865.0008

  # --- telephone era ---
