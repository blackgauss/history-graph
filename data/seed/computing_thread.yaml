    who: George Devol
    refs:
      patent_number: "2463463"
    notes: "Filed April 1946, granted March 1949; Devol later invented Unimate, the first industrial robot."

  - id: point-contact-transistor-1947
    date: "1947-12-23"
    kind: tech
    title: "Point-contact transistor demonstrated"
    who: Bardeen & Brattain, Bell Labs
    related: [kelly-joins-bell-labs-1925]

  - id: shannon-math-theory-comm-1948
    date: "1948"
    kind: paper
    title: "A Mathematical Theory of Communication"
    who: Claude Shannon
    refs:
      doi: 10.1002/j.1538-7305.1948.tb01338.x
    related: [kelly-joins-bell-labs-1925]
    notes: "Founded information theory; published in Bell System Technical Journal."

