[project]
name = "history-graph"
version = "0.1.0"
description = "Academic lineage and patent-impact graph pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.44.0",
    "pyyaml>=6.0.3",
    "tenacity>=8.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "dvc>=3.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/history_graph"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
