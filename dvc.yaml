stages:
  ingest:
    cmd: uv run python -m history_graph
    deps:
      - data/seed/dois.txt
      - src/history_graph
    outs:
      - data/raw
  thread:
    cmd: uv run python -m history_graph.thread && uv run python -m history_graph.report
    deps:
      - data/seed/computing_thread.yaml
      - src/history_graph
      - src/history_graph/report.py
    outs:
      - data/thread
